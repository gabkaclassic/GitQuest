version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: gitquest_postgres
    environment:
      POSTGRES_DB: gitquest
      POSTGRES_USER: gitquest-user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - gitquest_postgres_data:/var/lib/postgresql/data
    networks:
      - gitquest_network

volumes:
  redis_data:
  gitquest_postgres_data:

networks:
  keycloak_network:
  gitquest_network:
    driver: bridge
