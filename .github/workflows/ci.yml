name: CI

on:
  push:
    branches: [dev, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Verify modules
        run: go mod tidy && git diff --exit-code go.mod go.sum
      - name: Lint
        run: make lint
      - name: Test
        run: go test -race ./...
      - name: Build
        run: go build ./...
      - name: Docker image
        run: docker build -t gitquest:ci .
